name: AI Holly Post

# No schedule. The Wednesday job makes the video and texts it to Daryl; running
# this is how he says yes. It posts the video that already exists and never
# re-renders, so approving does not cost a second HeyGen charge or produce a
# different take than the one he approved.
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Thursday of the weekend (YYYY-MM-DD), blank = the next one'
        required: false
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post to Facebook and Instagram
        run: |
          FLAGS="--post"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            FLAGS="$FLAGS --week=${{ github.event.inputs.week }}"
          fi
          node scripts/holly-render.js $FLAGS
        env:
          BLOB_READ_WRITE_TOKEN:  ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          META_PAGE_ID:           ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID:     ${{ secrets.META_IG_ACCOUNT_ID }}
          ALERT_TOKEN:            ${{ secrets.ALERT_TOKEN }}
          SITE_URL:               https://manitoubeachmichigan.com
