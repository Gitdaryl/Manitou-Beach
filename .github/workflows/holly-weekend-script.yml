name: AI Holly Weekly Video

on:
  schedule:
    # Wednesday 5 PM ET = Wednesday 21:00 UTC while we are on EDT. Drifts to
    # 4 PM ET in winter, same as every other cron in this repo.
    #
    # Note the day field is 3 (Wednesday), not 4. Anything before midnight UTC
    # lands on the Wednesday UTC date; leaving it at 4 would fire a day late.
    #
    # Moved earlier from 8 PM so a slow HeyGen render still leaves the whole
    # evening to overlay, review and get the reel to Holly the same night. She
    # posts Thursday morning.
    - cron: '0 21 * * 3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Thursday of the weekend (YYYY-MM-DD), blank = the next one'
        required: false
        default: ''
      script_only:
        description: 'Write the script but skip the HeyGen render'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      overlay_only:
        description: 'Redo the graphics on an EXISTING render. Needs week. Never re-renders, so it cannot bill HeyGen again.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  make-video:
    # Skipped entirely for an overlay_only run. Re-rendering to fix a caption or
    # a chip image would bill HeyGen a second time for a take already approved.
    if: github.event.inputs.overlay_only != 'true'
    runs-on: ubuntu-latest
    # The render is the long pole: usually ~2 minutes, occasionally much longer.
    timeout-minutes: 40

    permissions:
      contents: write

    outputs:
      thursday: ${{ steps.week.outputs.thursday }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The overlay job runs on a different machine and must not work this out
      # for itself. This job takes the UPCOMING Thursday; holly-reel-kit takes
      # the PREVIOUS one, which is the same day only when you run it on a
      # Thursday. Left to guess on a Wednesday the two are seven days apart and
      # the overlay would quietly rebuild last weekend's reel.
      - name: Work out which weekend this is
        id: week
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "thursday=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            node -e '
              const f = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Detroit",
                year: "numeric", month: "2-digit", day: "2-digit" });
              const d = new Date(f.format(new Date()) + "T12:00:00Z");
              d.setUTCDate(d.getUTCDate() + ((4 - d.getUTCDay() + 7) % 7));
              console.log("thursday=" + d.toISOString().slice(0, 10));
            ' >> "$GITHUB_OUTPUT"
          fi
          echo "Weekend: $(grep thursday "$GITHUB_OUTPUT" | tail -1)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Writes the script only. It stays quiet on purpose: the render step
      # below sends the one text, so Daryl gets a video, not a homework list.
      - name: Write the script
        run: |
          FLAGS="--no-notify"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            FLAGS="$FLAGS --week=${{ github.event.inputs.week }}"
          fi
          node scripts/holly-weekend-script.js $FLAGS
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SITE_URL:              https://manitoubeachmichigan.com

      - name: Render the video
        if: github.event.inputs.script_only != 'true'
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then
            FLAGS="--week=${{ github.event.inputs.week }}"
          fi
          node scripts/holly-render.js $FLAGS
        env:
          HEYGEN_API_KEY:        ${{ secrets.HEYGEN_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_TOKEN:           ${{ secrets.ALERT_TOKEN }}
          SITE_URL:              https://manitoubeachmichigan.com

      # Second way to get the file, for when Daryl is at the desk rather than
      # on his phone. Downloadable from the run page for 30 days.
      - name: Attach the video to this run
        if: github.event.inputs.script_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-holly-video
          path: video-templates/holly-weekend/renders/*.mp4
          if-no-files-found: warn
          retention-days: 30

      # A dead scheduled job is silent. The slideshow this replaced failed
      # every week from May to August and nothing said a word.
      - name: Say so if it broke
        if: failure()
        run: |
          curl -s -X POST "$SITE_URL/api/internal-alert" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ALERT_TOKEN\",\"message\":\"AI Holly weekly video FAILED tonight. No video was made. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Could not send the failure alert either."
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          SITE_URL:    https://manitoubeachmichigan.com

      - name: Commit the script
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/ai-holly-weekend-*.md
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "AI Holly weekend script"
            git push
          fi

  # ---------------------------------------------------------------------------
  # The graphics pass. Runs on the Mac Studio through a self-hosted runner,
  # because HyperFrames needs a real GPU and whisper needs real cores: 56s there
  # against tens of minutes of software rendering on a hosted runner. The Studio
  # is on AC with sleep disabled, so "not home" does not mean "not running".
  #
  # It chains off make-video rather than running on its own schedule, so there
  # is no guess about how long HeyGen took.
  overlay:
    needs: make-video
    # always(), because on an overlay_only run make-video is skipped and a
    # skipped dependency would otherwise take this job down with it.
    if: >-
      always()
      && github.event.inputs.script_only != 'true'
      && (needs.make-video.result == 'success'
          || github.event.inputs.overlay_only == 'true')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    env:
      REEL_KIT:  /Users/darylyoung/Projects/holly-reel-kit
      SITE_URL:  https://manitoubeachmichigan.com
      # From make-video normally, straight from the input on an overlay_only run.
      THURSDAY:  ${{ needs.make-video.outputs.thursday || github.event.inputs.week }}

    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Homebrew, via GITHUB_PATH rather than a job-level PATH. Setting PATH in
      # the job env replaces it outright and drops the directory setup-node adds
      # for its own toolchain, so node would go missing on a machine that has it.
      - name: Put Homebrew on PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Check the tools are here
        run: |
          test -n "$THURSDAY" || { echo "overlay_only needs the week input"; exit 1; }
          for t in ffmpeg ffprobe whisper-cli; do
            command -v $t >/dev/null || { echo "missing: $t"; exit 1; }
          done
          test -d "$REEL_KIT/reel" || { echo "no reel kit at $REEL_KIT"; exit 1; }
          node -v

      # --deliver is the whole point of this job. It texts Holly only when the
      # reel is clean, and texts Yeti with the reason when it is not, so an
      # unattended Wednesday can never put a half-right reel in front of a
      # client. --publish arms "AI Holly Post"; it does not post anything.
      - name: Overlay the graphics and deliver
        working-directory: ${{ env.REEL_KIT }}/reel
        run: |
          node run.mjs \
            --thursday="$THURSDAY" \
            --from-blob --upload --publish --deliver
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_TOKEN:           ${{ secrets.ALERT_TOKEN }}

      - name: Attach the finished reel to this run
        uses: actions/upload-artifact@v4
        with:
          name: ai-holly-reel-overlaid
          path: ${{ env.REEL_KIT }}/holly-*-OVERLAID-web.mp4
          if-no-files-found: warn
          retention-days: 30

      # Same reasoning as the render job: a dead scheduled job is silent, and
      # silence here means Holly gets nothing on Thursday morning and nobody
      # finds out until she asks.
      - name: Say so if it broke
        if: failure()
        run: |
          curl -s -X POST "$SITE_URL/api/internal-alert" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ALERT_TOKEN\",\"message\":\"AI Holly OVERLAY failed for $THURSDAY. The HeyGen render exists but there is no finished reel. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Could not send the failure alert either."
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}

  # ---------------------------------------------------------------------------
  # The overlay job alerts on its own failures, but that step runs ON the Mac.
  # If the Mac is the problem, that alert cannot fire either, and the failure
  # mode is a silent Wednesday. This runs on GitHub's own hardware so there is
  # always something left alive to say the reel did not get made.
  watchdog:
    needs: [make-video, overlay]
    if: always() && needs.overlay.result != 'success' && github.event.inputs.script_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say the reel did not land
        run: |
          curl -s -X POST "$SITE_URL/api/internal-alert" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ALERT_TOKEN\",\"message\":\"AI Holly: no finished reel this week. The overlay job on the Mac ended as '${{ needs.overlay.result }}'. Check the Mac is on and the runner is up. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Could not send the alert."
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          SITE_URL:    https://manitoubeachmichigan.com
