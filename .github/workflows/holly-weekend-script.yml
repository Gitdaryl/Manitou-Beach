name: AI Holly Weekly Video

on:
  schedule:
    # Wednesday 5 PM ET = Wednesday 21:00 UTC while we are on EDT. Drifts to
    # 4 PM ET in winter, same as every other cron in this repo.
    #
    # Note the day field is 3 (Wednesday), not 4. Anything before midnight UTC
    # lands on the Wednesday UTC date; leaving it at 4 would fire a day late.
    #
    # Moved earlier from 8 PM so a slow HeyGen render still leaves the whole
    # evening to overlay, review and get the reel to Holly the same night. She
    # posts Thursday morning.
    - cron: '0 21 * * 3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Thursday of the weekend (YYYY-MM-DD), blank = the next one'
        required: false
        default: ''
      script_only:
        description: 'Write the script but skip the HeyGen render'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  make-video:
    runs-on: ubuntu-latest
    # The render is the long pole: usually ~2 minutes, occasionally much longer.
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Writes the script only. It stays quiet on purpose: the render step
      # below sends the one text, so Daryl gets a video, not a homework list.
      - name: Write the script
        run: |
          FLAGS="--no-notify"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            FLAGS="$FLAGS --week=${{ github.event.inputs.week }}"
          fi
          node scripts/holly-weekend-script.js $FLAGS
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SITE_URL:              https://manitoubeachmichigan.com

      - name: Render the video
        if: github.event.inputs.script_only != 'true'
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then
            FLAGS="--week=${{ github.event.inputs.week }}"
          fi
          node scripts/holly-render.js $FLAGS
        env:
          HEYGEN_API_KEY:        ${{ secrets.HEYGEN_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_TOKEN:           ${{ secrets.ALERT_TOKEN }}
          SITE_URL:              https://manitoubeachmichigan.com

      # Second way to get the file, for when Daryl is at the desk rather than
      # on his phone. Downloadable from the run page for 30 days.
      - name: Attach the video to this run
        if: github.event.inputs.script_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-holly-video
          path: video-templates/holly-weekend/renders/*.mp4
          if-no-files-found: warn
          retention-days: 30

      # A dead scheduled job is silent. The slideshow this replaced failed
      # every week from May to August and nothing said a word.
      - name: Say so if it broke
        if: failure()
        run: |
          curl -s -X POST "$SITE_URL/api/internal-alert" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$ALERT_TOKEN\",\"message\":\"AI Holly weekly video FAILED tonight. No video was made. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Could not send the failure alert either."
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          SITE_URL:    https://manitoubeachmichigan.com

      - name: Commit the script
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/ai-holly-weekend-*.md
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "AI Holly weekend script"
            git push
          fi
