name: Thursday Roundup Video

# RETIRED 2026-08-19. The schedule is removed, not the workflow, because Yeti is
# rebuilding the slideshow with a new design. Read this before you revive it: it
# had failed on every scheduled run since at least 2026-05-28, always the same
# way - NOTION_TOKEN_EVENTS returns 401 "API token is invalid". Nothing alerted,
# so it looked alive for three months. Fix the token AND add a failure alert
# before putting a cron back on it. The AI Holly job that replaced it reads the
# public /api/events instead, so it is not exposed to that token at all.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview only (no post)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Render and post
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            FLAGS="--preview"
          fi
          node scripts/thursday-pipeline.js $FLAGS
        env:
          NOTION_TOKEN_EVENTS:       ${{ secrets.NOTION_TOKEN_EVENTS }}
          NOTION_DB_EVENTS:          ${{ secrets.NOTION_DB_EVENTS }}
          META_PAGE_ID:              ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN:    ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID:        ${{ secrets.META_IG_ACCOUNT_ID }}
          BLOB_READ_WRITE_TOKEN:     ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SITE_URL:                  https://manitoubeachmichigan.com
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
